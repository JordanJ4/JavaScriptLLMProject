name: Deploy Azure Function App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Pull your repo code into the runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ LOGIN TO AZURE (THIS IS WHAT YOU WERE MISSING)
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

