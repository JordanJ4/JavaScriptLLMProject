name: Deploy Azure Function App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ✅ REQUIRED: Azure authentication
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ✅ Deploy function
      - name: Deploy Azure Function App
        uses: Azure/functions-action@v1
        with:
          app-name: <YOUR_FUNCTION_APP_NAME>
          package: .
